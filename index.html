<title>Partner Profiles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: go-to-partners directory. Dark AI hero (cover image) over a light, monday-branded directory; profile = header card + story + proof cards. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F5F6F8; --sand:#F6F4F1; --line:#E1E4EF;
  --ink:#323338; --muted:#676879; --faint:#9699A6; --night:#000000; --on-night:#FFFFFF; --on-night-muted:#C5C7D4;
  --primary:#6161FF; --primary-soft:#ECECFF; --green:#00C875; --green-soft:#DDF7EC; --orange:#FDAB3D; --orange-soft:#FEF0DC;
  --teal-soft:#DFF4F4; --purple-soft:#EFE4F8; --yellow:#FFCB00;
  --shadow:0 6px 20px rgba(29,35,73,.08);
  --head:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131F; --surface:#1C1E33; --surface2:#25284A; --sand:#22243C; --line:#33365A;
  --ink:#E6E9EF; --muted:#B4B8CC; --faint:#8A8EA8; --primary:#8585FF; --primary-soft:#2E3066;
  --green-soft:#173F33; --orange-soft:#45382A; --teal-soft:#1D3D40; --purple-soft:#36294D;
  --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12131F; --surface:#1C1E33; --surface2:#25284A; --sand:#22243C; --line:#33365A;
  --ink:#E6E9EF; --muted:#B4B8CC; --faint:#8A8EA8; --primary:#8585FF; --primary-soft:#2E3066;
  --green-soft:#173F33; --orange-soft:#45382A; --teal-soft:#1D3D40; --purple-soft:#36294D;
  --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
@media(max-width:520px){.wrap{padding-inline:16px}}

/* nav: white brand bar in both themes, like monday.com/gotopartners */
nav{background:#FFFFFF;color:#323338;border-bottom:1px solid #E1E4EF}
nav .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#323338}
.logo img{height:26px;width:auto;display:block}
.logo span{font-family:var(--head);font-weight:300;font-size:22px;letter-spacing:-.01em;color:#323338}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;color:#676879;padding:8px 12px;border-radius:6px;cursor:pointer;font-family:var(--head);font-size:15px}
.tabs button[aria-current="page"]{color:#323338}
.navr{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#676879;cursor:pointer}
.toggle input{accent-color:#6161FF}
/* hero */
.hero{position:relative;background:var(--night) center/cover no-repeat;color:var(--on-night);overflow:hidden}
.hero .wrap{padding-block:72px 64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:300;line-height:1.12;max-width:20ch}
.hero h1 b{font-weight:500}
.hero p{color:var(--on-night-muted);font-size:16px;max-width:58ch}
.search{display:flex;gap:8px;width:min(560px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 6px 6px 18px;backdrop-filter:blur(6px)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--on-night);font-size:15px;outline:none}
.search input::placeholder{color:var(--on-night-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-family:var(--head);font-size:14px;cursor:pointer;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.light{background:#fff;border-color:#fff;color:#000}
.btn.ghost{background:transparent}

/* directory */
.dir{display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;padding-block:32px 72px}
@media(max-width:900px){.dir{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--sand);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;align-self:start}
.rail h2{font-size:17px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--head);font-size:13.5px}
select.inp{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 10px;font-size:14px;color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--head);font-size:13.5px}
.switch input{width:18px;height:18px;accent-color:var(--green)}
.count{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.count b{font-family:var(--head);font-weight:500;font-size:17px}
.note{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px}

.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.art{margin:12px;border-radius:12px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art .mono{font-family:var(--head);font-weight:600;font-size:32px;letter-spacing:-.01em}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);color:#323338;font-weight:500}
.badge.ex{background:var(--yellow)}
.badge.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.card .meta{padding:4px 20px 0;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:21px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tier{font-family:var(--body);font-size:12px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.where{font-size:13px;color:var(--muted)}
.pitch{font-size:13.5px;color:var(--ink);min-height:40px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:500}
.tag.n{background:var(--surface2);color:var(--muted);font-weight:400}
.stats{margin:14px 20px 18px;border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.prod{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.pi{width:12px;height:12px;border-radius:50%;display:inline-block}
.empty{border:1px dashed var(--line);border-radius:16px;padding:32px;text-align:center;color:var(--muted)}

/* profile */
.prof{padding-block:24px 72px;display:flex;flex-direction:column;gap:28px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-family:var(--head);align-self:flex-start}
.top{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
@media(max-width:920px){.top{grid-template-columns:minmax(0,1fr)}}
.idcard{background:var(--sand);border-radius:22px;padding:32px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.avatar{width:112px;height:112px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--head);font-weight:600;font-size:38px}
.idmain{flex:1;min-width:230px;display:flex;flex-direction:column;gap:14px}
.idmain h1{font-size:clamp(26px,4vw,36px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.kv{display:flex;gap:24px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}.kv b{font-weight:500}.kv span{font-size:12.5px;color:var(--muted)}
.verify{display:flex;gap:8px;flex-wrap:wrap}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--green-soft);color:var(--ink)}
.vchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.vchip.self{background:var(--surface2)}.vchip.self::before{background:var(--faint)}
.story{border-radius:22px;padding:32px;color:var(--on-night);background:var(--night) center/cover no-repeat;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.55));pointer-events:none}
.story>*{position:relative;z-index:1}
.story h2{font-size:24px}
.story .why{font-family:var(--head);font-size:18px;font-weight:300;line-height:1.4}
.story p{color:var(--on-night-muted)}
.story .tags .tag{background:rgba(255,255,255,.14);color:#fff}
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px}
@media(max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:15px}
.box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.box li{display:flex;gap:8px;align-items:center}
.price{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.price b{font-variant-numeric:tabular-nums}
.consult{border-radius:16px;padding:18px 20px;background:var(--primary-soft);display:flex;flex-direction:column;gap:8px}
.consult b{font-family:var(--head);font-weight:500;font-size:15px}
.main{display:flex;flex-direction:column;gap:30px;min-width:0}
.main h2{font-size:24px;margin-bottom:14px}
.ucs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:16px}
.uc{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.uc .metric{font-family:var(--head);font-size:26px;font-weight:600;line-height:1.1}
.uc h4{font-size:15.5px}
.uc p{font-size:13.5px;color:var(--muted)}
.str{display:flex;flex-direction:column;gap:12px}
.sr{display:grid;grid-template-columns:minmax(0,220px) 1fr 80px;gap:12px;align-items:center}
.sr .bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.sr .bar i{height:10px;border-radius:3px;background:var(--surface2);display:block}
.sr .lv{font-size:12.5px;color:var(--muted)}
@media(max-width:520px){.sr{grid-template-columns:minmax(0,1fr) 70px}.sr .bar{grid-column:1/-1;grid-row:2}}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:12px}
.tm{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.tm .ini{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--head);font-weight:600}
.tm b{font-family:var(--head);font-weight:500;display:block}.tm span{font-size:12.5px;color:var(--muted)}
.cta-band{border-radius:22px;padding:28px 32px;background:var(--night) center/cover no-repeat;color:var(--on-night);display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.cta-band p{color:var(--on-night-muted);max-width:60ch}

/* source labels */
.src{display:none;font-family:var(--body);font-size:10.5px;font-weight:500;color:#fff;background:#E2445C;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.show-src .src{display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;border-radius:10px;font-family:var(--head);font-size:14px;z-index:9;max-width:min(92vw,520px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<nav><div class="wrap">
  <a class="logo" href="#" aria-label="monday.com AI partners"><img src="assets/monday-logo.png" alt="monday.com"><span>AI partners</span></a>
  <div class="tabs"><button type="button" id="t-dir" aria-current="page">Our partners</button></div>
  <div class="navr"><label class="toggle"><input type="checkbox" id="srcToggle"> Show which form question feeds each part</label></div>
</div></nav>
<main id="view"></main>
<div class="toast" id="toast" hidden></div>

<script>
const COVER = "assets/cover.jpg";
const PROD = {"Work management":"#A25DDC","CRM":"#00C875","Dev":"#579BFC","Service":"#FB275D","Campaigns":"#FDAB3D","monday AI":"#6161FF"};
const LV = ['Learning','Capable','Strong','Expert','Lead partner'];
/* Example profiles, filled the way the form fills them. Not real partners. */
let P = [];
const S = (k)=>`<span class="src">${k}</span>`;
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini = s=>String(s).split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const usd = n=>'$'+Number(n).toLocaleString('en-US');
const $ = s=>document.querySelector(s);
const dots = ps=>`<span class="prod">${ps.map(p=>`<i class="pi" title="monday ${esc(p)}" style="background:${PROD[p]||'#999'}"></i>`).join('')}</span>`;
function fromPrice(p){ if(p.pricing.fixed) return 'From '+usd(p.pricing.fixed); if(p.pricing.hourly) return usd(p.pricing.hourly)+'/hour'; if(p.pricing.retainer) return usd(p.pricing.retainer)+'/month'; return '—'; }
let F = {q:'',industry:'',region:'',language:'',service:'',size:'',consult:false};
const uniq = k=>[...new Set(P.flatMap(p=>[].concat(p[k])))].sort();

function card(p){
  return `<button type="button" class="card" data-id="${p.id}">
    <div class="art" style="background:linear-gradient(135deg,${p.color}1f,${p.color}55)">
      <div class="badges">${p.example?'<span class="badge ex">Example</span>':''}${p.consult?'<span class="badge ok">Free 20-min AI consult</span>':''}${p.vetted.certified?`<span class="badge">${p.certified} monday-certified</span>`:''}</div>
      <span class="mono" style="color:${p.color}">${esc(ini(p.company))}</span>
    </div>
    <div class="meta">
      <h3>${esc(p.company)}<span class="tier">${esc(p.tier)}</span></h3>
      <span class="where">${esc([p.hq].concat(p.countries).join(', '))} · ${esc(p.languages.join(', '))}${S('Q: HQ, countries, languages')}</span>
      <p class="pitch">${esc(p.promise)}${S('Q: One-line promise')}</p>
      <div class="tags">${p.known.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}${S('Q: Best known for')}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Pricing${S('Q: How you charge')}</div><div class="v">${fromPrice(p)}</div></div>
      <div class="stat"><div class="k">Agency size</div><div class="v">${esc(p.size)}</div></div>
      <div class="stat"><div class="k">Products</div><div class="v">${dots(p.products)}</div></div>
    </div></button>`;
}
function viewDir(){
  const opt=(a,v)=>'<option value="">Any</option>'+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  $('#view').innerHTML=`
  <section class="hero" style="background-image:url(${COVER})"><div class="wrap">
    <h1>Find a certified partner to <b>put monday AI to work</b></h1>
    <p>Every partner here is vetted by monday. Pick one by industry, language and what they are best at, and get a free 20-minute consultation.</p>
    <div class="search"><input id="q" aria-label="Search partners" placeholder="Search by name, skill or industry" value="${esc(F.q)}"><button type="button" class="btn light" id="go">Search</button></div>
  </div></section>
  <div class="wrap dir">
    <aside class="rail" aria-label="Filters"><h2>Filter by</h2>
      <div class="field"><label for="f-industry">Your industry</label><select class="inp" id="f-industry">${opt(uniq('industries'),F.industry)}</select></div>
      <div class="field"><label for="f-region">Region</label><select class="inp" id="f-region">${opt(uniq('regions'),F.region)}</select></div>
      <div class="field"><label for="f-language">Language</label><select class="inp" id="f-language">${opt(uniq('languages'),F.language)}</select></div>
      <div class="field"><label for="f-service">Service</label><select class="inp" id="f-service">${opt(uniq('services'),F.service)}</select></div>
      <div class="field"><label for="f-size">Your company size</label><select class="inp" id="f-size">${opt(uniq('sizes'),F.size)}</select></div>
      <label class="switch" for="f-consult">Offers a free AI consultation<input type="checkbox" id="f-consult" ${F.consult?'checked':''}></label>
    </aside>
    <div><div class="count"><b id="n"></b><span class="note" id="dnote"></span></div><div class="grid" id="grid"></div></div>
  </div>`;
  ['industry','region','language','service','size'].forEach(k=>$('#f-'+k).onchange=e=>{F[k]=e.target.value;drawGrid();});
  $('#f-consult').onchange=e=>{F.consult=e.target.checked;drawGrid();};
  $('#q').oninput=e=>{F.q=e.target.value;drawGrid();}; $('#go').onclick=drawGrid;
  drawGrid();
}
function drawGrid(){
  const q=F.q.toLowerCase();
  const r=P.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!F.industry||p.industries.includes(F.industry))&&(!F.region||p.regions.includes(F.region))
    &&(!F.language||p.languages.includes(F.language))&&(!F.service||p.services.includes(F.service))&&(!F.size||p.sizes.includes(F.size))&&(!F.consult||p.consult));
  $('#n').textContent=r.length+(r.length===1?' partner':' partners');
  $('#dnote').textContent=P.some(p=>p.example)?'Example partners. Real profiles appear here once they are approved.':'';
  $('#grid').innerHTML=r.length?r.map(card).join(''):'<div class="empty">No partner matches these filters yet. Clear one to see more.</div>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>viewProf(c.dataset.id));
}
function viewProf(id){
  const p=P.find(x=>x.id===id); const c=p.color;
  const pr=[]; if(p.pricing.fixed) pr.push(['Smallest fixed project',usd(p.pricing.fixed)]); if(p.pricing.hourly) pr.push(['Hourly rate',usd(p.pricing.hourly)+'/hour']); if(p.pricing.retainer) pr.push(['Monthly retainer from',usd(p.pricing.retainer)+'/month']);
  $('#view').innerHTML=`<div class="wrap prof">
  <button type="button" class="back" id="back">← All partners</button>
  <div class="top">
    <div class="idcard">
      <div class="avatar" style="background:${c}">${esc(ini(p.company))}</div>
      <div class="idmain">
        <div class="verify">${p.vetted.certified?`<span class="vchip">${p.certified} monday-certified people, verified</span>`:''}${p.vetted.fde?'<span class="vchip">Approved for AI consultations</span>':''}${p.example?'<span class="vchip self">Example profile</span>':''}${S('Roy\'s vetting columns')}</div>
        <h1>${esc(p.company)}<span class="tier">${esc(p.tier)}</span></h1>
        <div class="kv">
          <div><b>${esc(p.hq)}</b><span>Headquarters${S('Q: HQ country')}</span></div>
          <div><b>${esc(p.countries.join(', ')||'—')}</b><span>Also in</span></div>
          <div><b>${esc(p.languages.join(', '))}</b><span>Languages</span></div>
          <div><b>${esc(p.size)}</b><span>People</span></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${p.consult?'<button type="button" class="btn primary" data-req>Request a free 20-min consultation</button>':'<button type="button" class="btn primary" data-req>Request an intro</button>'}
          <span class="note" style="align-self:center">${p.consult?`Takes about ${p.consultPerMonth} consultations a month`:'Paid engagements only'}${S('Q: Free consultation')}</span>
        </div>
      </div>
    </div>
    <div class="story" style="background-image:url(${COVER})">
      <h2>About ${esc(p.company)}</h2>
      <p class="why">${esc(p.why)}${S('Q: Why customers pick you')}</p>
      <p>${esc(p.about)}${S('Q: About you (max 3 sentences)')}</p>
      <div class="tags">${p.known.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>
    </div>
  </div>
  <div class="cols">
    <div class="side">
      <div class="box"><h3>Industries${S('Q: Industries')}</h3><div class="tags">${p.industries.map(i=>`<span class="tag n">${esc(i)}</span>`).join('')}</div></div>
      <div class="box"><h3>Clients they work with${S('Q: Client types + sizes')}</h3><ul>${p.clientTypes.map(i=>`<li>${esc(i)}</li>`).join('')}${p.sizes.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
      <div class="box"><h3>monday products</h3><ul>${p.products.map(n=>`<li><i class="pi" style="background:${PROD[n]}"></i>monday ${esc(n)}</li>`).join('')}</ul></div>
      <div class="box"><h3>Pricing${S('Q: How you charge + amounts')}</h3>${pr.map(([k,v])=>`<div class="price"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
      ${p.consult?`<div class="consult"><b>Free 20-minute AI consultation</b><span class="note">A first call to see where monday AI can save your team time. No cost or commitment.</span></div>`:''}
    </div>
    <div class="main">
      <section><h2>Results${S('Q: Use cases 1-3')}</h2><div class="ucs">${p.uc.map(u=>`<div class="uc" style="border-top:4px solid ${c}"><span class="note">${esc(u.i)}</span><span class="metric" style="color:${c}">${esc(u.r)}</span><h4>${esc(u.t)}</h4><p>${esc(u.b)}</p></div>`).join('')}</div></section>
      <section><h2>Strengths${S('Q: Strength ratings')}</h2><p class="note" style="margin:-8px 0 12px">Self-assessed by the partner and reviewed by monday.</p><div class="str">${Object.entries(p.strengths).map(([s,n])=>`<div class="sr"><span>${esc(s)}</span><span class="bar">${[1,2,3,4,5].map(i=>`<i style="${i<=n?'background:'+c:''}"></i>`).join('')}</span><span class="lv">${LV[n-1]}</span></div>`).join('')}</div></section>
      <section><h2>Services${S('Q: Services')}</h2><div class="tags">${p.services.map(s=>`<span class="tag n">${esc(s)}</span>`).join('')}</div></section>
      <section><h2>Team${S('Q: Your team')}</h2><div class="team">${p.team.map(([n,r])=>`<div class="tm"><span class="ini" style="background:${c}">${esc(ini(n))}</span><div><b>${esc(n)}</b><span>${esc(r)}</span></div></div>`).join('')}</div></section>
    </div>
  </div>
  <div class="cta-band" style="background-image:url(${COVER})"><div><h2 style="font-size:22px">Want ${esc(p.company)} to look at your account?</h2><p>monday makes the introduction. The partner only gets your details after you say yes.</p></div><button type="button" class="btn light" data-req>${p.consult?'Request a free consultation':'Request an intro'}</button></div>
  </div>`;
  $('#back').onclick=viewDir; window.scrollTo(0,0);
  document.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>toast('Preview only. In the live version this sends the request to monday, and monday makes the introduction.'));
}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3600);}
$('#t-dir').onclick=viewDir;
$('#srcToggle').onchange=e=>document.body.classList.toggle('show-src',e.target.checked);
fetch('data/profiles.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{P=d.partners||[];viewDir();}).catch(()=>{P=[];viewDir();});
</script>
